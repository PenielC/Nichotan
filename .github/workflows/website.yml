name: Website (www.nichotan.com)

# The public website has its own pipeline, separate from the app's (deploy.yml). A change under website/ checks and deploys only the
# website; a change to the app does not touch it. Pull requests run the checks only. A push to main also deploys.
# "Run workflow" re-deploys main. Setup steps are in docs/deployment.md ("The public website").
on:
  pull_request:
    paths: ['website/**', 'infra/website.bicep', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'infra/website.bicep', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Writes the finished site to website/out.
      - run: npm run build
      # Compiles the Bicep file: catches syntax and type mistakes without needing an Azure login.
      - name: Check the infrastructure file
        working-directory: .
        run: az bicep build --file infra/website.bicep --stdout > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: website-out
          path: website/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The same "production" environment as the app: add required reviewers in GitHub to make deployments wait for approval.
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      SITE: nichotan-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-out
          path: website/out

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Creates the Static Web App the first time; does nothing when it already exists.
      - name: Provision the Static Web App
        run: |
          az deployment group create --resource-group "$RG" --name "nichotan-website-${{ github.run_number }}" \
            --template-file infra/website.bicep --parameters siteName="$SITE"

      # The deployment token is read from Azure at run time, so there is no extra secret to create or rotate in GitHub.
      - name: Get the deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$SITE" --resource-group "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # The site was already built above, so this only uploads website/out.
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: website/out
          skip_app_build: true
          skip_api_build: true

      - name: Show where it is
        run: |
          echo "Deployed to https://$(az staticwebapp show --name "$SITE" --resource-group "$RG" --query defaultHostname -o tsv)" >> "$GITHUB_STEP_SUMMARY"
